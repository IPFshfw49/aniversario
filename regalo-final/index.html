<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversario</title>
    <!-- Tailwind CSS para el diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Iconos y Fuentes -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background: linear-gradient(180deg, #fff5f5 0%, #ffe4e6 30%, #fce4ec 100%); min-height: 100vh; overflow-x: hidden; }
        .font-script { font-family: 'Dancing Script', cursive; }
        .tab-content { display: none; animation: fadeIn 0.5s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Animación Splash */
        #splash { position: fixed; inset: 0; z-index: 50; background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 30%, #f48fb1 60%, #ffccbc 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s; }
        .float-up { animation: floatUp 3s infinite ease-in-out; position: absolute; bottom: 0; }
        @keyframes floatUp { 0% { transform: translateY(100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; } }
        
        .bar-fill { transition: height 0.5s ease-out; }
    </style>
</head>
<body class="pb-20">

    <!-- PANTALLA DE CARGA (SPLASH) -->
    <div id="splash">
        <span class="float-up text-3xl text-rose-400" style="left: 20%; animation-duration: 2.5s;">❤️</span>
        <span class="float-up text-2xl text-amber-300" style="left: 50%; animation-duration: 3s;">🍦</span>
        <span class="float-up text-3xl text-yellow-300" style="left: 80%; animation-duration: 2.2s;">✨</span>
        <div class="w-32 h-32 rounded-full bg-white/40 flex items-center justify-center mb-6 shadow-lg border-4 border-white">
            <!-- Usamos una de vuestras fotos para la intro -->
            <img src="foto8.jpg" alt="Ian y Miriam" class="w-28 h-28 object-cover rounded-full">
        </div>
        <h1 class="font-script text-5xl font-bold text-center text-rose-600 drop-shadow-md">¡Feliz Aniversario!</h1>
        <p class="text-rose-800/70 font-bold mt-2 text-xl">Ian & Miriam</p>
    </div>

    <!-- BARRA SUPERIOR -->
    <div class="sticky top-0 z-30 bg-white/80 backdrop-blur-sm border-b border-rose-100 py-3 text-center shadow-sm">
        <span class="font-script text-2xl text-rose-500"><i class="ri-heart-fill text-rose-400"></i> Ian & Miriam <i class="ri-heart-fill text-rose-400"></i></span>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="pt-6 px-4 max-w-md mx-auto">
        
        <!-- SECCIÓN 1: VALE -->
        <div id="sec-vale" class="tab-content active bg-white/90 rounded-2xl p-6 shadow-sm border border-rose-50 text-center">
            <!-- Referencia exacta al nombre de tu archivo del vale -->
            <img src="vale.png.png" alt="Vale llaollao" class="w-full h-56 object-cover rounded-xl mb-4 shadow-sm border border-gray-100">
            <h2 class="font-script text-3xl text-rose-600 mb-1">Vale de Llaollao</h2>
            <p class="text-rose-400 text-sm mb-6 font-bold">Para disfrutar juntos</p>
            
            <div class="flex flex-wrap justify-center gap-3 mb-6" id="circles-container">
                <!-- Los círculos se generan por JavaScript -->
            </div>

            <button id="btn-canjear" onclick="canjearYogur()" class="bg-gradient-to-r from-green-400 to-green-600 text-white font-bold px-8 py-3 rounded-full shadow-md active:scale-95 transition-transform mb-3">
                Canjear 1 Yogur
            </button>
            <p id="msg-vale" class="font-bold text-rose-500 text-lg h-6">¡Que aprovecheee! Quedan 7 vales.</p>
        </div>

        <!-- SECCIÓN 2: MOMENTOS (Galería Polaroid) -->
        <div id="sec-momentos" class="tab-content bg-white/90 rounded-2xl p-6 shadow-sm border border-rose-50 text-center">
            <h2 class="font-script text-3xl text-rose-600 mb-6">Nuestros Momentos</h2>
            <div class="flex flex-col gap-6">
                <!-- Las 8 fotos con estilo polaroid y rotaciones alternas -->
                <img src="foto1.jpg" class="w-full h-72 object-cover rounded-lg p-2 pb-8 bg-white shadow-lg transform -rotate-2" alt="Momento 1">
                <img src="foto2.jpg" class="w-full h-72 object-cover rounded-lg p-2 pb-8 bg-white shadow-lg transform rotate-2" alt="Momento 2">
                <img src="foto3.jpg" class="w-full h-72 object-cover rounded-lg p-2 pb-8 bg-white shadow-lg transform -rotate-1" alt="Momento 3">
                <img src="foto4.jpg" class="w-full h-72 object-cover rounded-lg p-2 pb-8 bg-white shadow-lg transform rotate-3" alt="Momento 4">
                <img src="foto5.jpg" class="w-full h-72 object-cover rounded-lg p-2 pb-8 bg-white shadow-lg transform -rotate-3" alt="Momento 5">
                <img src="foto6.jpg" class="w-full h-72 object-cover rounded-lg p-2 pb-8 bg-white shadow-lg transform rotate-1" alt="Momento 6">
                <img src="foto7.jpg" class="w-full h-72 object-cover rounded-lg p-2 pb-8 bg-white shadow-lg transform -rotate-2" alt="Momento 7">
                <img src="foto8.jpg" class="w-full h-72 object-cover rounded-lg p-2 pb-8 bg-white shadow-lg transform rotate-2" alt="Momento 8">
            </div>
            <p class="mt-8 font-script text-2xl text-rose-400">Y los que quedan por vivir... ❤️</p>
        </div>

        <!-- SECCIÓN 3: MEDIDOR -->
        <div id="sec-medidor" class="tab-content bg-white/90 rounded-2xl p-6 shadow-sm border border-rose-50 text-center">
            <h2 class="font-script text-3xl text-rose-600 mb-4">Medidor de Amor</h2>
            
            <div id="msg-medidor" class="text-rose-500 font-bold text-xl h-8 mb-4 animate-bounce"></div>

            <div class="flex justify-around items-end h-64 mb-8">
                <!-- Barra Ian -->
                <div class="flex flex-col items-center w-24">
                    <div class="h-48 w-12 bg-rose-100 rounded-full flex items-end overflow-hidden mb-3 relative shadow-inner">
                        <div id="bar-ian" class="w-full bg-gradient-to-t from-rose-400 to-rose-600 bar-fill rounded-full" style="height: 0%;"></div>
                        <span id="txt-ian" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-white font-bold drop-shadow-md z-10">0%</span>
                    </div>
                    <span class="font-bold text-rose-600 mb-3 text-lg">Ian</span>
                    <button onclick="sumarIan()" class="w-14 h-14 rounded-full bg-rose-50 border-2 border-rose-200 text-2xl shadow-sm active:scale-95">❤️</button>
                </div>

                <!-- Barra Miriam -->
                <div class="flex flex-col items-center w-24">
                    <div class="h-48 w-12 bg-pink-100 rounded-full flex items-end overflow-hidden mb-3 relative shadow-inner">
                        <div id="bar-miriam" class="w-full bg-gradient-to-t from-pink-400 to-pink-600 bar-fill rounded-full" style="height: 0%;"></div>
                        <span id="txt-miriam" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-white font-bold drop-shadow-md z-10">0%</span>
                    </div>
                    <span class="font-bold text-pink-600 mb-3 text-lg">Miriam</span>
                    <button onclick="sumarMiriam()" class="w-14 h-14 rounded-full bg-pink-50 border-2 border-pink-200 text-2xl shadow-sm active:scale-95">💖</button>
                </div>
            </div>
            <p class="text-sm text-rose-400 font-bold">Toca los corazones para llenar las barras</p>
        </div>

    </main>

    <!-- MENÚ INFERIOR (TABS) -->
    <div class="fixed bottom-0 w-full bg-white border-t border-gray-100 flex justify-around py-3 z-40 pb-6 shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
        <button onclick="cambiarTab('vale')" class="flex flex-col items-center text-rose-500 w-1/3">
            <i class="ri-ticket-2-line text-2xl"></i><span class="text-xs font-bold mt-1">Vale</span>
        </button>
        <button onclick="cambiarTab('momentos')" class="flex flex-col items-center text-rose-300 w-1/3 border-l border-r border-rose-50">
            <i class="ri-image-line text-2xl"></i><span class="text-xs font-bold mt-1">Momentos</span>
        </button>
        <button onclick="cambiarTab('medidor')" class="flex flex-col items-center text-rose-300 w-1/3">
            <i class="ri-heart-pulse-line text-2xl"></i><span class="text-xs font-bold mt-1">Medidor</span>
        </button>
    </div>

    <script>
        // --- 1. QUITAR PANTALLA DE CARGA ---
        setTimeout(() => {
            const splash = document.getElementById('splash');
            splash.style.opacity = '0';
            setTimeout(() => splash.style.display = 'none', 800);
        }, 3000);

        // --- 2. NAVEGACIÓN ENTRE PESTAÑAS ---
        function cambiarTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('sec-' + tabId).classList.add('active');
            
            const botones = document.querySelectorAll('.fixed.bottom-0 button');
            botones.forEach(btn => {
                btn.classList.remove('text-rose-500');
                btn.classList.add('text-rose-300');
            });
            event.currentTarget.classList.remove('text-rose-300');
            event.currentTarget.classList.add('text-rose-500');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- 3. LÓGICA DEL VALE ---
        let valesConsumidos = 0;
        const maxVales = 7;
        const container = document.getElementById('circles-container');
        
        for(let i=1; i<=maxVales; i++) {
            container.innerHTML += `<div id="circulo-${i}" class="w-12 h-12 rounded-full border-2 border-green-500 text-green-500 flex items-center justify-center text-lg font-bold bg-white transition-all duration-300 shadow-sm">${i}</div>`;
        }

        function canjearYogur() {
            if (valesConsumidos < maxVales) {
                valesConsumidos++;
                const circulo = document.getElementById(`circulo-${valesConsumidos}`);
                circulo.classList.replace('border-green-500', 'border-rose-300');
                circulo.classList.replace('text-green-500', 'text-transparent');
                circulo.classList.replace('bg-white', 'bg-rose-100');
                circulo.innerHTML = '<span class="text-rose-500 text-2xl animate-bounce">❤️</span>';

                const quedan = maxVales - valesConsumidos;
                if(quedan > 0) {
                    document.getElementById('msg-vale').innerText = `¡Que aprovecheee! Quedan ${quedan} vales.`;
                } else {
                    document.getElementById('msg-vale').innerText = "Ñam Ñam Ñam";
                    const btn = document.getElementById('btn-canjear');
                    btn.innerText = "Agotado";
                    btn.classList.replace('from-green-400', 'from-gray-300');
                    btn.classList.replace('to-green-600', 'to-gray-400');
                    btn.classList.remove('active:scale-95');
                }
            }
        }

        // --- 4. LÓGICA DEL MEDIDOR DE AMOR ---
        let amorIan = 0;
        let amorMiriam = 0;

        function actualizarBarras() {
            document.getElementById('bar-ian').style.height = amorIan + '%';
            document.getElementById('txt-ian').innerText = amorIan + '%';
            document.getElementById('bar-miriam').style.height = amorMiriam + '%';
            document.getElementById('txt-miriam').innerText = amorMiriam + '%';

            const msg = document.getElementById('msg-medidor');
            if (amorIan >= 100) {
                msg.innerText = "✨ Yo siempre te querré un poquito mas ✨";
            } else if (amorIan >= 60 || amorMiriam >= 60) {
                msg.innerText = "✨ ¡Cuánto amor! ✨";
            } else if (amorIan >= 30 || amorMiriam >= 30) {
                msg.innerText = "✨ ¡Esto se calienta! ✨";
            }
        }

        function sumarIan() {
            if (amorIan < 100) amorIan = Math.min(amorIan + 10, 100);
            actualizarBarras();
        }

        function sumarMiriam() {
            if (amorMiriam < 100) amorMiriam = Math.min(amorMiriam + 10, 100);
            if (amorIan < 100) amorIan = Math.min(amorIan + 20, 100);
            actualizarBarras();
        }
    </script>
</body>
</html>
