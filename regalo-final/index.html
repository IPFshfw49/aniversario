<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background: linear-gradient(180deg, #fff5f5 0%, #ffe4e6 30%, #fce4ec 100%); min-height: 100vh; overflow-x: hidden; }
        .font-script { font-family: 'Dancing Script', cursive; }
        .tab-content { display: none; animation: fadeIn 0.6s ease-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Animación Splash */
        #splash { position: fixed; inset: 0; z-index: 50; background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 30%, #f48fb1 60%, #ffccbc 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s; }
        .float-up { animation: floatUp 3s infinite ease-in-out; position: absolute; bottom: 0; }
        @keyframes floatUp { 0% { transform: translateY(100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; } }
        
        /* Corazones flotantes de fondo 3D */
        .bg-heart {
            position: fixed; bottom: -50px; font-size: 1.5rem; opacity: 0;
            animation: floatUpBg infinite linear; pointer-events: none; z-index: 0;
        }
        .blur-sm { filter: blur(2px); }
        .blur-md { filter: blur(4px); }
        @keyframes floatUpBg {
            0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-110vh) scale(1.2) rotate(25deg); opacity: 0; }
        }

        /* Texto Brillante (Shimmer Text) */
        .gradient-text {
            background: linear-gradient(to right, #e11d48, #f43f5e, #fb7185, #e11d48);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 3s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }

        /* Fotos Polaroid balanceándose suavemente */
        .polaroid { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .polaroid:hover { transform: scale(1.08) rotate(0deg) !important; z-index: 30; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2); }
        .sway-1 { animation: sway1 6s ease-in-out infinite alternate; }
        .sway-2 { animation: sway2 7s ease-in-out infinite alternate; }
        @keyframes sway1 { 0% { transform: rotate(-3deg); } 100% { transform: rotate(1deg); } }
        @keyframes sway2 { 0% { transform: rotate(2deg); } 100% { transform: rotate(-2deg); } }

        /* Latido de corazón */
        .heartbeat { animation: heartbeat 1.5s infinite; }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        /* Pulso para el botón del Vale */
        .btn-pulse { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); animation: pulseBtn 2s infinite cubic-bezier(0.66, 0, 0, 1); }
        @keyframes pulseBtn { to { box-shadow: 0 0 0 15px rgba(74, 222, 128, 0); } }

        .animate-float-text { animation: floatText 2.5s ease-in-out infinite; }
        @keyframes floatText { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .bar-fill { transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="pb-20 relative selection:bg-rose-200">

    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="bg-heart blur-sm" style="left: 10%; animation-duration: 9s; animation-delay: 0s;">💖</div>
        <div class="bg-heart" style="left: 25%; animation-duration: 12s; animation-delay: 2s; font-size: 1rem;">💕</div>
        <div class="bg-heart blur-md" style="left: 45%; animation-duration: 8s; animation-delay: 4s; font-size: 2.5rem;">💗</div>
        <div class="bg-heart" style="left: 65%; animation-duration: 11s; animation-delay: 1s;">💘</div>
        <div class="bg-heart blur-sm" style="left: 85%; animation-duration: 14s; animation-delay: 3s; font-size: 1.2rem;">💝</div>
        <div class="bg-heart" style="left: 15%; animation-duration: 15s; animation-delay: 5s;">💓</div>
        <div class="bg-heart blur-md" style="left: 75%; animation-duration: 10s; animation-delay: 6s; font-size: 2rem;">💞</div>
        <div class="bg-heart" style="left: 55%; animation-duration: 13s; animation-delay: 7s;">✨</div>
    </div>

    <div id="splash">
        <span class="float-up text-3xl text-rose-400" style="left: 20%; animation-duration: 2.5s;">❤️</span>
        <span class="float-up text-2xl text-amber-300" style="left: 50%; animation-duration: 3s;">🍦</span>
        <span class="float-up text-3xl text-yellow-300" style="left: 80%; animation-duration: 2.2s;">✨</span>
        <div class="w-32 h-32 rounded-full bg-white/40 flex items-center justify-center mb-6 shadow-xl border-4 border-white z-10 animate-float-text">
            <img src="foto8.jpg" alt="Ian y Miriam" class="w-28 h-28 object-cover rounded-full">
        </div>
        <h1 class="font-script text-5xl font-bold text-center gradient-text drop-shadow-md z-10">¡Feliz Aniversario!</h1>
        <p class="text-rose-700 font-bold mt-3 text-xl z-10 tracking-widest uppercase text-sm">Ian & Miriam</p>
    </div>

    <div class="sticky top-0 z-40 bg-white/70 backdrop-blur-md border-b border-rose-100 py-3 text-center shadow-sm">
        <span class="font-script text-2xl gradient-text font-bold"><i class="ri-heart-fill text-rose-400 animate-pulse"></i> Ian & Miriam <i class="ri-heart-fill text-rose-400 animate-pulse"></i></span>
    </div>

    <main class="pt-6 px-4 max-w-md mx-auto relative z-10">
        
        <div id="sec-vale" class="tab-content active bg-white/80 backdrop-blur-md rounded-3xl p-6 shadow-xl border border-white/50 text-center">
            <div class="overflow-hidden rounded-xl mb-5 shadow-md">
                <img src="vale.png.png" alt="Vale llaollao" class="w-full h-56 object-cover hover:scale-105 transition-transform duration-500">
            </div>
            <h2 class="font-script text-4xl gradient-text mb-1 pb-1">Vale de Llaollao</h2>
            <p class="text-rose-400 text-sm mb-6 font-bold uppercase tracking-wide">Para disfrutar juntos</p>
            
            <div class="flex flex-wrap justify-center gap-3 mb-8" id="circles-container">
                </div>

            <button id="btn-canjear" onclick="canjearYogur()" class="btn-pulse bg-gradient-to-r from-green-400 to-emerald-500 text-white font-bold px-8 py-3.5 rounded-full shadow-lg active:scale-95 transition-all duration-300 mb-4 group relative overflow-hidden">
                <span class="relative z-10 flex items-center gap-2"><i class="ri-sparkling-fill"></i> Canjear 1 Yogur</span>
                <div class="absolute inset-0 h-full w-full bg-white/20 scale-x-0 group-hover:scale-x-100 transition-transform origin-left"></div>
            </button>
            <p id="msg-vale" class="font-bold text-rose-500 text-lg h-6 drop-shadow-sm">¡Que aprovecheee! Quedan 7 vales.</p>
        </div>

        <div id="sec-momentos" class="tab-content bg-white/80 backdrop-blur-md rounded-3xl p-6 shadow-xl border border-white/50 text-center">
            <h2 class="font-script text-4xl gradient-text mb-8 pb-1">Nuestros Momentos</h2>
            <div class="flex flex-col gap-10 relative">
                <div class="absolute left-1/2 top-0 bottom-0 w-0.5 bg-rose-200/50 -translate-x-1/2 -z-10 rounded-full"></div>
                
                <img src="foto1.jpg" class="polaroid sway-1 w-full h-72 object-cover rounded-xl p-2.5 pb-10 bg-white shadow-lg relative" alt="Momento 1">
                <img src="foto2.jpg" class="polaroid sway-2 w-full h-72 object-cover rounded-xl p-2.5 pb-10 bg-white shadow-lg relative" alt="Momento 2">
                <img src="foto3.jpg" class="polaroid sway-1 w-full h-72 object-cover rounded-xl p-2.5 pb-10 bg-white shadow-lg relative" alt="Momento 3">
                <img src="foto4.jpg" class="polaroid sway-2 w-full h-72 object-cover rounded-xl p-2.5 pb-10 bg-white shadow-lg relative" alt="Momento 4">
                <img src="foto5.jpg" class="polaroid sway-1 w-full h-72 object-cover rounded-xl p-2.5 pb-10 bg-white shadow-lg relative" alt="Momento 5">
                <img src="foto6.jpg" class="polaroid sway-2 w-full h-72 object-cover rounded-xl p-2.5 pb-10 bg-white shadow-lg relative" alt="Momento 6">
                <img src="foto7.jpg" class="polaroid sway-1 w-full h-72 object-cover rounded-xl p-2.5 pb-10 bg-white shadow-lg relative" alt="Momento 7">
                <img src="foto8.jpg" class="polaroid sway-2 w-full h-72 object-cover rounded-xl p-2.5 pb-10 bg-white shadow-lg relative" alt="Momento 8">
            </div>
            <p class="mt-10 font-script text-3xl gradient-text animate-pulse">Y los que quedan por vivir... ❤️</p>
        </div>

        <div id="sec-medidor" class="tab-content bg-white/80 backdrop-blur-md rounded-3xl p-6 shadow-xl border border-white/50 text-center">
            <h2 class="font-script text-4xl gradient-text mb-3 pb-1">Medidor de Amor</h2>
            
            <div class="w-full min-h-[5rem] flex items-center justify-center relative z-20 mb-4">
                <span id="msg-medidor" class="text-rose-500 font-bold text-xl leading-snug text-center px-2 drop-shadow-md"></span>
            </div>

            <div class="flex justify-around items-end h-72 mb-10 mt-2 relative z-10 bg-white/40 p-4 rounded-3xl shadow-inner border border-rose-50">
                <div class="flex flex-col items-center w-24">
                    <div class="h-48 w-12 bg-white rounded-full flex items-end overflow-hidden mb-4 relative shadow-[inset_0_4px_10px_rgba(0,0,0,0.1)]">
                        <div id="bar-ian" class="w-full bg-gradient-to-t from-rose-400 via-rose-500 to-rose-600 bar-fill rounded-full" style="height: 0%;"></div>
                        <span id="txt-ian" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-white font-bold drop-shadow-md z-10 text-sm">0%</span>
                    </div>
                    <span class="font-bold text-rose-600 mb-4 text-lg">Ian</span>
                    <button onclick="sumarIan()" class="heartbeat w-16 h-16 rounded-full bg-gradient-to-br from-rose-50 to-rose-100 border-2 border-rose-200 text-3xl shadow-lg active:scale-90 hover:from-rose-100 hover:to-rose-200 transition-all">❤️</button>
                </div>

                <div class="flex flex-col items-center w-24">
                    <div class="h-48 w-12 bg-white rounded-full flex items-end overflow-hidden mb-4 relative shadow-[inset_0_4px_10px_rgba(0,0,0,0.1)]">
                        <div id="bar-miriam" class="w-full bg-gradient-to-t from-pink-400 via-pink-500 to-pink-600 bar-fill rounded-full" style="height: 0%;"></div>
                        <span id="txt-miriam" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-white font-bold drop-shadow-md z-10 text-sm">0%</span>
                    </div>
                    <span class="font-bold text-pink-600 mb-4 text-lg">Miriam</span>
                    <button onclick="sumarMiriam()" class="heartbeat w-16 h-16 rounded-full bg-gradient-to-br from-pink-50 to-pink-100 border-2 border-pink-200 text-3xl shadow-lg active:scale-90 hover:from-pink-100 hover:to-pink-200 transition-all" style="animation-delay: 0.5s">💖</button>
                </div>
            </div>
            <p class="text-sm text-rose-400 font-bold bg-white/50 py-2 rounded-full inline-block px-4">Toca los corazones para llenar las barras</p>
        </div>

    </main>

    <div class="fixed bottom-0 w-full bg-white/90 backdrop-blur-lg border-t border-rose-100 flex justify-around py-3 z-50 pb-6 shadow-[0_-10px_20px_rgba(225,29,72,0.05)]">
        <button onclick="cambiarTab('vale')" class="flex flex-col items-center text-rose-500 w-1/3 transition-all hover:scale-105 active:scale-95">
            <i class="ri-ticket-2-line text-2xl mb-1"></i><span class="text-xs font-bold">Vale</span>
        </button>
        <button onclick="cambiarTab('momentos')" class="flex flex-col items-center text-rose-300 w-1/3 border-l border-r border-rose-100 transition-all hover:scale-105 active:scale-95">
            <i class="ri-image-line text-2xl mb-1"></i><span class="text-xs font-bold">Momentos</span>
        </button>
        <button onclick="cambiarTab('medidor')" class="flex flex-col items-center text-rose-300 w-1/3 transition-all hover:scale-105 active:scale-95">
            <i class="ri-heart-pulse-line text-2xl mb-1"></i><span class="text-xs font-bold">Medidor</span>
        </button>
    </div>

    <script>
        // --- 1. QUITAR PANTALLA DE CARGA ---
        setTimeout(() => {
            const splash = document.getElementById('splash');
            splash.style.opacity = '0';
            setTimeout(() => splash.style.display = 'none', 800);
        }, 3000);

        // --- 2. NAVEGACIÓN ENTRE PESTAÑAS ---
        function cambiarTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('sec-' + tabId).classList.add
